<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Contact Enoch Olayemi about web development and software projects."
    />

    <title>Contact | Enoch Olayemi</title>

    <script src="js/theme-preference.js"></script>
    <link rel="stylesheet" href="dist/styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-logo" href="index.html">Enoch Olayemi</a>

        <ul class="site-nav__list">
          <li><a href="resume.html">Resume</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
        <details class="theme-menu">
          <summary class="theme-control">
            <span class="visually-hidden">Color scheme</span>
          </summary>
          <div
            class="theme-extra"
            role="group"
            aria-label="Choose color scheme"
          >
            <label class="theme-control theme-pick" data-theme-pick="light">
              <input name="theme-preference" type="radio" value="light" />
              <span aria-hidden="true">&#9788;&#65039;</span>
              <span class="visually-hidden">Light</span>
            </label>
            <label class="theme-control theme-pick" data-theme-pick="system">
              <input
                name="theme-preference"
                type="radio"
                value="system"
                checked
              />
              <span aria-hidden="true">&#9881;&#65039;</span>
              <span class="visually-hidden">System default</span>
            </label>
            <label class="theme-control theme-pick" data-theme-pick="dark">
              <input name="theme-preference" type="radio" value="dark" />
              <span aria-hidden="true">&#127766;</span>
              <span class="visually-hidden">Dark</span>
            </label>
          </div>
        </details>
      </nav>
    </header>

    <main id="main" class="page">
      <header class="page-header">
        <h1>Contact Me</h1>

        <p>
          Have a question or want to discuss a project? Send me a message using
          the form below.
        </p>
      </header>

      <form class="contact-form">
        <div class="form-field">
          <label for="contact-name">Name</label>
          <input
            id="contact-name"
            name="name"
            type="text"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-field">
          <label for="contact-email">Email</label>
          <input
            id="contact-email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-field">
          <label for="contact-message">Message</label>
          <textarea
            id="contact-message"
            name="message"
            rows="5"
            required
          ></textarea>
        </div>

        <label class="checkbox-field" for="contact-updates">
          <input id="contact-updates" name="updates" type="checkbox" />
          <span>Subscribe to project updates</span>
        </label>

        <button type="submit">Send Message</button>
      </form>
    </main>
  </body>
</html>
